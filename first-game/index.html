<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#080d1c">
    <title>STAR BLASTER</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="game-shell">
      <header class="game-header">
        <a class="wordmark" href="./" aria-label="STAR BLASTER ホーム">STAR<span>BLASTER</span></a>
        <p class="game-tagline">銀河を駆け抜けろ</p>
      </header>

      <section class="game-frame" aria-label="横スクロールシューティングゲーム">
        <canvas id="game" width="960" height="540" aria-label="ゲーム画面">
          このゲームを遊ぶにはCanvasに対応したブラウザーが必要です。
        </canvas>
        <div class="hud" aria-live="polite">
          <div><span class="hud-label">SCORE</span><span id="score">000000</span></div>
          <div><span class="hud-label">LIVES</span><span id="lives" class="lives">♥ ♥ ♥</span></div>
        </div>
        <div class="overlay" id="overlay">
          <p class="eyebrow" id="overlay-eyebrow">READY, PILOT?</p>
          <h1 id="overlay-title">STAR BLASTER</h1>
          <p id="overlay-message">敵を撃ち落として、ハイスコアを目指そう。</p>
          <button id="start-button" type="button">ゲームスタート</button>
          <p class="overlay-hint">移動 <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> / <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd>　射撃 <kbd>SPACE</kbd></p>
        </div>
      </section>

      <nav class="touch-controls" aria-label="タッチ操作">
        <div class="direction-pad" aria-label="移動">
          <button type="button" data-control="up" aria-label="上へ">▲</button>
          <button type="button" data-control="left" aria-label="左へ">◀</button>
          <button type="button" data-control="down" aria-label="下へ">▼</button>
          <button type="button" data-control="right" aria-label="右へ">▶</button>
        </div>
        <button class="fire-button" type="button" data-control="fire" aria-label="射撃">FIRE</button>
      </nav>
      <footer>WAVE 01 <span>・</span> GOOD LUCK, PILOT</footer>
    </main>
  </body>
</html>
